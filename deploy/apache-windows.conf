# Apache 2.4 for Windows 11
# Existing DocumentRoot: C:/Apache24/htdocs
# Include this file from httpd.conf. It does not replace the existing DocumentRoot.

Alias "/c-questionaire/" "C:/Apache24/htdocs/c-questionaire/public/"

<Directory "C:/Apache24/htdocs/c-questionaire/public">
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    Require ip 10.0.0.0/8

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</Directory>

# The application, configuration, database, and .env remain outside the Alias.
# Requests under /c-questionaire are served exclusively from public/.
