<VirtualHost *:80>
    ServerName flu-survey.example.local
    DocumentRoot /var/www/c-questionaire/public
    <Directory /var/www/c-questionaire/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/flu-questionnaire-error.log
    CustomLog ${APACHE_LOG_DIR}/flu-questionnaire-access.log combined
</VirtualHost>
